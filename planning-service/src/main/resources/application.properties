spring.application.name=planning-service
server.port=8085

spring.data.mongodb.uri=${MONGODB_URI:mongodb://planning_service:ojino_dev_password@localhost:27017/ojino_planning?authSource=ojino_planning}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Validation des access tokens. Meme secret que l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# ---------------------------------------------------------------------------
# Services consultes pour generer un planning.
# user-service pour les disponibilites, learning-service pour les priorites.
# Une panne de learning-service n'empeche pas de planifier : on se rabat sur les
# echeances seules.
# ---------------------------------------------------------------------------
ojino.downstream.user.base-url=${USER_SERVICE_URL:http://localhost:8082}
ojino.downstream.user.connect-timeout=2s
ojino.downstream.user.read-timeout=3s

ojino.downstream.learning.base-url=${LEARNING_SERVICE_URL:http://localhost:8084}
ojino.downstream.learning.connect-timeout=2s
ojino.downstream.learning.read-timeout=3s

# ---------------------------------------------------------------------------
# Reglages du planificateur.
# Ce sont des choix pedagogiques : la bonne duree d'une seance n'est pas la meme
# en CP et en prepa.
# ---------------------------------------------------------------------------
ojino.planning.session-minutes=45
ojino.planning.min-session-minutes=20
ojino.planning.break-minutes=10
ojino.planning.max-sessions-per-day=4
ojino.planning.spaced-review-days=14

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.planning_service=DEBUG
