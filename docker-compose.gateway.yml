# Passerelle Caddy.
#
# Fichier separe du docker-compose.yml principal : celui-ci ne contient que
# MongoDB, dont on a besoin a chaque instant du developpement. La passerelle,
# elle, ne sert qu'a deux moments — verifier le routage en local, et deployer.
#
#   Local  : docker compose -f docker-compose.gateway.yml up -d
#   Serveur: OJINO_DOMAIN=ojino.cm docker compose -f docker-compose.gateway.yml up -d
#
# Les amonts par defaut pointent vers host.docker.internal, c'est-a-dire vers
# les services lances depuis IntelliJ. Le jour ou ils seront conteneurises, il
# suffira de renseigner les variables *_UPSTREAM avec les noms de conteneurs.

services:
  gateway:
    image: caddy:2-alpine
    container_name: ojino-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 passe par UDP. Sans cette ligne, Caddy sert quand meme le site
      # en HTTP/2 : c'est un gain de latence, pas une condition de marche.
      - "443:443/udp"
    environment:
      # ":80" en local : Caddy ecoute alors en clair et ne demande aucun
      # certificat. Mets un nom de domaine et il obtient puis renouvelle le
      # certificat tout seul, sans configuration ACME.
      OJINO_DOMAIN: ${OJINO_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-contact@ojino.cm}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-host.docker.internal:8081}
      USER_UPSTREAM: ${USER_UPSTREAM:-host.docker.internal:8082}
      CONTENT_UPSTREAM: ${CONTENT_UPSTREAM:-host.docker.internal:8083}
      LEARNING_UPSTREAM: ${LEARNING_UPSTREAM:-host.docker.internal:8084}
      PLANNING_UPSTREAM: ${PLANNING_UPSTREAM:-host.docker.internal:8085}
      MEDIA_UPSTREAM: ${MEDIA_UPSTREAM:-host.docker.internal:8086}
      NOTIFICATION_UPSTREAM: ${NOTIFICATION_UPSTREAM:-host.docker.internal:8087}
      ENGAGEMENT_UPSTREAM: ${ENGAGEMENT_UPSTREAM:-host.docker.internal:8088}
      ASSISTANT_UPSTREAM: ${ASSISTANT_UPSTREAM:-host.docker.internal:8089}
      REALTIME_UPSTREAM: ${REALTIME_UPSTREAM:-host.docker.internal:8090}
      SUPPORT_UPSTREAM: ${SUPPORT_UPSTREAM:-host.docker.internal:8092}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-host.docker.internal:4200}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats vivent ici. Sans ce volume, chaque redemarrage en
      # redemanderait a Let's Encrypt, dont les quotas sont vite atteints.
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # Necessaire sous Linux : host.docker.internal n'y existe pas nativement,
      # contrairement a Docker Desktop.
      - "host.docker.internal:host-gateway"

volumes:
  caddy-data:
  caddy-config:
