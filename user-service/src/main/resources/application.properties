spring.application.name=user-service
server.port=8082

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ojino_user}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# Validation des access tokens.
# Le secret doit etre exactement celui de l'auth-service : c'est ce partage qui
# permet a ce service de valider un token sans appeler l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# ---------------------------------------------------------------------------
# Referentiel scolaire : il appartient au content-service.
# Ce service ne stocke que les codes choisis par l'eleve et demande a
# content-service de les valider, uniquement pendant l'inscription.
# Les delais sont courts : mieux vaut echouer vite et proposer de reessayer que
# de laisser la requete de l'eleve pendre.
# ---------------------------------------------------------------------------
ojino.content.base-url=${CONTENT_SERVICE_URL:http://localhost:8083}
ojino.content.connect-timeout=2s
ojino.content.read-timeout=3s

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.user_service=DEBUG
