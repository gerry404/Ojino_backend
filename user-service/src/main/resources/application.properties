spring.application.name=user-service
server.port=8082

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ojino_user}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# Validation des access tokens.
# Le secret doit etre exactement celui de l'auth-service : c'est ce partage qui
# permet a ce service de valider un token sans appeler l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# ---------------------------------------------------------------------------
# Referentiel scolaire.
# Les niveaux, filieres et matieres vivent en base, pas dans le code : ouvrir
# l'application a un nouveau pays ne demande pas de redeploiement.
# Au premier demarrage, les systemes livres dans education-systems.json sont
# charges si la base est vide. Les modifications faites en base ne sont jamais
# ecrasees ensuite.
# ---------------------------------------------------------------------------
ojino.reference.seed-on-startup=true
ojino.reference.default-system=CM-FR

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.user_service=DEBUG
