spring.application.name=media-service
server.port=8086

spring.data.mongodb.uri=${MONGODB_URI:mongodb://media_service:ojino_dev_password@localhost:27017/ojino_media?authSource=ojino_media}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Le transfert passe par le corps de la requete : la limite de Spring doit couvrir
# le plus gros usage autorise (10 Mo pour un devoir), sinon le serveur coupe avant
# que le service ait son mot a dire.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

# ---------------------------------------------------------------------------
# Validation des access tokens. Meme secret que l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# ---------------------------------------------------------------------------
# Stockage.
# En developpement les fichiers vont sur disque et les adresses signees pointent
# vers ce service. En production, un stockage objet prend le relais : il suffit de
# declarer un bean MediaStorage, rien d'autre ne change.
# ---------------------------------------------------------------------------
# Stockage actif. "local" ecrit sur disque et expose le controleur de transfert ;
# toute autre valeur suppose qu'un bean MediaStorage est fourni ailleurs.
ojino.media.storage=${MEDIA_STORAGE:local}
ojino.media.public-base-url=${MEDIA_PUBLIC_URL:http://localhost:8086}
# Ce secret protege les adresses de telechargement : sans lui, une adresse forgee
# donnerait acces a n'importe quel fichier. 32 caracteres minimum.
ojino.media.signing-secret=${OJINO_MEDIA_SECRET:dev-secret-media-a-remplacer-en-production-32+}
ojino.media.upload-ttl=15m
ojino.media.download-ttl=1h
# Au-dela, un envoi jamais confirme est considere abandonne.
ojino.media.pending-ttl=2h
ojino.media.local.directory=${MEDIA_DIRECTORY:./data/media}

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.media_service=DEBUG
