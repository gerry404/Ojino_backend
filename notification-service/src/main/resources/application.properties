spring.application.name=notification-service
server.port=8087

spring.data.mongodb.uri=${MONGODB_URI:mongodb://notification_service:ojino_dev_password@localhost:27017/ojino_notification?authSource=ojino_notification}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Validation des access tokens. Meme secret que l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# Secret partage protegeant /api/v1/internal, appele par les autres services
# depuis leurs taches planifiees. Solution d'attente : il ne distingue pas les
# services entre eux. A remplacer par une vraie identite de service quand ils se
# multiplieront.
ojino.security.internal-token=${OJINO_INTERNAL_TOKEN:dev-internal-token-a-remplacer-en-production}

# ---------------------------------------------------------------------------
# File d'envoi.
# ---------------------------------------------------------------------------
ojino.notification.batch-size=100
ojino.notification.max-attempts=5
# Delai de la premiere reprise. Il double a chaque tentative : 1, 2, 4, 8 minutes.
ojino.notification.retry-delay=1m

# Expediteurs actifs. "logging" ecrit dans les logs au lieu d'envoyer ; toute
# autre valeur suppose que de vrais expediteurs sont declares ailleurs.
ojino.notification.senders=${NOTIFICATION_SENDERS:logging}

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.notification_service=DEBUG
