# La plateforme Ojino.
#
# Trois profils, pour ne demarrer que ce dont on a besoin :
#
#   docker compose up -d                      MongoDB seul — le quotidien du
#                                             developpement, les services
#                                             tournant depuis l'IDE
#   docker compose --profile tools up -d      + mongo-express
#   docker compose --profile full up -d       + les dix services + la passerelle
#
# Le dernier est celui du serveur : une commande, toute la plateforme.

x-common-env: &common-env
  # Le meme secret pour tous : chaque service valide les tokens emis par
  # l'auth-service sans jamais l'appeler. Un service qui ne partagerait pas ce
  # secret rejetterait tout le monde.
  OJINO_JWT_SECRET: ${OJINO_JWT_SECRET:-dev-secret-a-remplacer-absolument-en-production-32+}
  TZ: ${TZ:-Africa/Douala}

x-internal-env: &internal-env
  # Protege les routes de service a service, celles qui n'ont pas d'utilisateur
  # derriere elles.
  OJINO_INTERNAL_TOKEN: ${OJINO_INTERNAL_TOKEN:-dev-internal-token-a-remplacer-en-production}

x-service: &service
  restart: unless-stopped
  profiles: ["full"]
  depends_on:
    mongo:
      condition: service_healthy
  # Aucun port publie : la passerelle est la seule porte d'entree. Un service
  # joignable directement depuis l'exterieur contournerait le TLS, les entetes
  # de securite et les futures limites de debit.

services:

  # ---------------------------------------------------------------------------
  # Base de donnees
  # ---------------------------------------------------------------------------

  mongo:
    image: mongo:7
    container_name: ojino-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ojino_root_dev}
      # Lu par le script d'initialisation ci-dessous.
      OJINO_DB_PASSWORD: ${OJINO_DB_PASSWORD:-ojino_dev_password}
    volumes:
      - mongo-data:/data/db
      # Les scripts de ce dossier ne s'executent qu'au tout premier demarrage,
      # quand le volume est vide. Pour les rejouer : docker compose down -v
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Interface web pour inspecter les donnees. Uniquement en developpement :
  # elle est demarree par le profil "tools" et non par defaut.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: ojino-mongo-express
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      # 8090 et non 8081 : ce dernier est deja pris par l'auth-service.
      - "8090:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-ojino_root_dev}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Services metier
  # ---------------------------------------------------------------------------

  auth-service:
    <<: *service
    build: ./auth-service
    container_name: ojino-auth
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://auth_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_auth?authSource=ojino_auth
      OJINO_ADMIN_EMAILS: ${OJINO_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}

  user-service:
    <<: *service
    build: ./user-service
    container_name: ojino-user
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://user_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_user?authSource=ojino_user
      CONTENT_SERVICE_URL: http://content-service:8083

  content-service:
    <<: *service
    build: ./content-service
    container_name: ojino-content
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://content_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_content?authSource=ojino_content

  learning-service:
    <<: *service
    build: ./learning-service
    container_name: ojino-learning
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://learning_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_learning?authSource=ojino_learning
      CONTENT_SERVICE_URL: http://content-service:8083

  planning-service:
    <<: *service
    build: ./planning-service
    container_name: ojino-planning
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://planning_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_planning?authSource=ojino_planning
      USER_SERVICE_URL: http://user-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8084

  media-service:
    <<: *service
    build: ./media-service
    container_name: ojino-media
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://media_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_media?authSource=ojino_media
      OJINO_MEDIA_SECRET: ${OJINO_MEDIA_SECRET:-dev-media-secret-a-remplacer-en-production}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_DIRECTORY: /app/data/media
      MEDIA_PUBLIC_URL: ${OJINO_PUBLIC_URL:-http://localhost}/api/media
    volumes:
      # Sans ce volume, les fichiers televerses disparaissent au premier
      # redemarrage du conteneur.
      - media-data:/app/data/media

  notification-service:
    <<: *service
    build: ./notification-service
    container_name: ojino-notification
    environment:
      <<: [*common-env, *internal-env]
      MONGODB_URI: mongodb://notification_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_notification?authSource=ojino_notification
      NOTIFICATION_SENDERS: ${NOTIFICATION_SENDERS:-}

  engagement-service:
    <<: *service
    build: ./engagement-service
    container_name: ojino-engagement
    environment:
      <<: [*common-env, *internal-env]
      MONGODB_URI: mongodb://engagement_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_engagement?authSource=ojino_engagement
      NOTIFICATION_SERVICE_URL: http://notification-service:8087

  assistant-service:
    <<: *service
    build: ./assistant-service
    container_name: ojino-assistant
    environment:
      <<: [*common-env, *internal-env]
      MONGODB_URI: mongodb://assistant_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_assistant?authSource=ojino_assistant
      USER_SERVICE_URL: http://user-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8084
      CONTENT_SERVICE_URL: http://content-service:8083
      # ai-service tourne desormais dans le meme reseau. Son fournisseur
      # vaut "echo" par defaut : le parcours complet s'eprouve sans compte
      # ni facture.
      AI_ENGINE: ${AI_ENGINE:-remote}
      AI_SERVICE_URL: http://ai-service:8091

  support-service:
    <<: *service
    build: ./support-service
    container_name: ojino-support
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://support_service:${OJINO_DB_PASSWORD:-ojino_dev_password}@mongo:27017/ojino_support?authSource=ojino_support
      SUPPORT_FAQ_PUBLIC: ${SUPPORT_FAQ_PUBLIC:-false}

  # ---------------------------------------------------------------------------
  # Services des autres depots
  #
  # Contextes de build relatifs : les trois depots sont clones cote a cote,
  # chaque dossier portant le nom de son depot. Les variables ne servent qu'a
  # couvrir une arborescence differente.
  # ---------------------------------------------------------------------------

  realtime-service:
    build:
      context: ${REALTIME_CONTEXT:-../Ojino_fast_backend}
    container_name: ojino-realtime
    restart: unless-stopped
    profiles: ["full"]
    environment:
      <<: [*common-env, *internal-env]
      PORT: "8090"
      OJINO_JWT_ISSUER: ojino-auth
      # Quelles pages ont le droit d'ouvrir une WebSocket. Une liste vide
      # autorise tout : commode en developpement, inacceptable en production.
      ALLOWED_ORIGINS: ${OJINO_PUBLIC_URL:-http://localhost}
      MAX_CONNECTIONS_PER_USER: ${MAX_CONNECTIONS_PER_USER:-5}

  ai-service:
    build:
      context: ${AI_CONTEXT:-../Ojino_ia_backend}
    container_name: ojino-ai
    restart: unless-stopped
    profiles: ["full"]
    # Aucun port publie et aucune route dans le Caddyfile : ce service n'a pas
    # de resource server, il ne sait pas valider un jeton d'utilisateur. Il
    # n'existe que sur le reseau prive, pour assistant-service.
    #
    # Il ne recoit pas non plus OJINO_JWT_SECRET : il n'en a aucun usage, et
    # un secret qu'un service ne detient pas est un secret qu'il ne peut pas
    # laisser fuir.
    environment:
      TZ: ${TZ:-Africa/Douala}
      PORT: "8091"
      # Le service python nomme cette variable INTERNAL_TOKEN quand les
      # services Spring l'appellent OJINO_INTERNAL_TOKEN. Noms differents,
      # valeur identique — sinon assistant-service prend un 401.
      INTERNAL_TOKEN: ${OJINO_INTERNAL_TOKEN:-dev-internal-token-a-remplacer-en-production}
      # "echo" fabrique les reponses : aucun modele appele, aucune facture.
      LLM_PROVIDER: ${LLM_PROVIDER:-echo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      CONTENT_SERVICE_URL: http://content-service:8083

  # ---------------------------------------------------------------------------
  # Passerelle
  #
  # realtime-service (Go, 8090) et ai-service (Python, 8091) vivent dans
  # d'autres depots. Quand ils rejoindront celui-ci, il suffira d'ajouter leur
  # bloc ci-dessus et de pointer REALTIME_UPSTREAM / AI_SERVICE_URL dessus.
  # ---------------------------------------------------------------------------

  gateway:
    image: caddy:2-alpine
    container_name: ojino-gateway
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 passe par UDP. Sans cette ligne Caddy sert quand meme le site en
      # HTTP/2 : c'est un gain de latence, pas une condition de marche.
      - "443:443/udp"
    environment:
      # ":80" en local : Caddy ecoute en clair et ne demande aucun certificat.
      # Mets un nom de domaine et il l'obtient puis le renouvelle tout seul.
      OJINO_DOMAIN: ${OJINO_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-contact@ojino.cm}
      AUTH_UPSTREAM: auth-service:8081
      USER_UPSTREAM: user-service:8082
      CONTENT_UPSTREAM: content-service:8083
      LEARNING_UPSTREAM: learning-service:8084
      PLANNING_UPSTREAM: planning-service:8085
      MEDIA_UPSTREAM: media-service:8086
      NOTIFICATION_UPSTREAM: notification-service:8087
      ENGAGEMENT_UPSTREAM: engagement-service:8088
      ASSISTANT_UPSTREAM: assistant-service:8089
      SUPPORT_UPSTREAM: support-service:8092
      REALTIME_UPSTREAM: realtime-service:8090
      WEB_UPSTREAM: ${WEB_UPSTREAM:-host.docker.internal:4200}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats vivent ici. Sans ce volume, chaque redemarrage en
      # redemanderait a Let's Encrypt, dont les quotas sont vite atteints.
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # Necessaire sous Linux : host.docker.internal n'y existe pas
      # nativement, contrairement a Docker Desktop.
      - "host.docker.internal:host-gateway"

volumes:
  mongo-data:
  media-data:
  caddy-data:
  caddy-config:
