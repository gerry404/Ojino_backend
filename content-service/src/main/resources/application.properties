spring.application.name=content-service
server.port=8083

# Le defaut correspond aux identifiants crees par docker-compose a la racine.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://content_service:ojino_dev_password@localhost:27017/ojino_content?authSource=ojino_content}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Validation des access tokens.
# Le secret doit etre exactement celui de l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# ---------------------------------------------------------------------------
# Referentiel scolaire.
# Au premier demarrage, les systemes livres dans education-systems.json sont
# charges si la base est vide. Les modifications faites en base ne sont jamais
# ecrasees ensuite.
# ---------------------------------------------------------------------------
ojino.reference.seed-on-startup=true
ojino.reference.default-system=CM-FR

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.content_service=DEBUG
