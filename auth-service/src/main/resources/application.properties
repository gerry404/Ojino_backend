spring.application.name=auth-service
server.port=8081

# Mongo doit tourner pour que le service demarre : le bean mongoTemplate teste la
# connexion des sa creation. En local :
#   docker run -d -p 27017:27017 --name ojino-mongo mongo:7
# ou une base gratuite sur MongoDB Atlas, en renseignant MONGODB_URI.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ojino_auth}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# Signature de nos propres access tokens (HS256).
# Le secret doit faire au moins 32 caracteres. Celui-ci n'est bon que pour le
# developpement : en production on passe imperativement par la variable
# d'environnement OJINO_JWT_SECRET.
# ---------------------------------------------------------------------------
ojino.auth.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.auth.jwt.issuer=ojino-auth
ojino.auth.jwt.access-token-ttl=30m

# ---------------------------------------------------------------------------
# Refresh tokens : c'est ici que se joue le "on ne se reconnecte jamais".
# La duree est glissante, elle repart de zero a chaque rotation.
# ---------------------------------------------------------------------------
ojino.auth.refresh.mobile-ttl=365d
ojino.auth.refresh.web-ttl=90d

# Cookie porteur du refresh token cote web (le mobile, lui, recoit le token
# dans le corps de la reponse et le range dans son keystore securise).
ojino.auth.cookie.name=ojino_rt
ojino.auth.cookie.path=/api/v1/auth
ojino.auth.cookie.same-site=Lax
# A passer a true des que le web est servi en HTTPS.
ojino.auth.cookie.secure=false
ojino.auth.cookie.domain=

# ---------------------------------------------------------------------------
# Connexion par SMS
# ---------------------------------------------------------------------------
ojino.auth.otp.length=6
ojino.auth.otp.ttl=5m
ojino.auth.otp.max-attempts=5
ojino.auth.otp.resend-cooldown=60s
# Renvoie le code dans la reponse HTTP pour tester sans fournisseur SMS.
# IMPERATIVEMENT a false en production.
ojino.auth.otp.expose-code=true

# ---------------------------------------------------------------------------
# Connexion Google / Apple.
# Renseigner les client IDs quand les projets seront crees. Tant que la liste
# est vide, le provider correspondant refuse poliment les connexions au lieu
# d'accepter n'importe quel token.
# Google : un client ID par plateforme (web, iOS, Android).
# Apple : le bundle ID pour iOS, le Services ID pour le web.
# ---------------------------------------------------------------------------
ojino.auth.google.client-ids=${GOOGLE_CLIENT_IDS:}
ojino.auth.apple.client-ids=${APPLE_CLIENT_IDS:}

# Origines autorisees pour l'app web (CORS).
ojino.auth.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.auth_service=DEBUG
