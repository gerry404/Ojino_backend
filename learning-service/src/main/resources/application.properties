spring.application.name=learning-service
server.port=8084

spring.data.mongodb.uri=${MONGODB_URI:mongodb://learning_service:ojino_dev_password@localhost:27017/ojino_learning?authSource=ojino_learning}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Validation des access tokens. Meme secret que l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# ---------------------------------------------------------------------------
# content-service detient le programme et le graphe de prerequis.
# Appele pour la remediation : savoir quoi faire reprendre a un eleve qui bloque.
# ---------------------------------------------------------------------------
ojino.content.base-url=${CONTENT_SERVICE_URL:http://localhost:8083}
ojino.content.connect-timeout=2s
ojino.content.read-timeout=3s

# ---------------------------------------------------------------------------
# Calcul de la maitrise.
# Une notion est acquise a partir de mastered-threshold, en difficulte en dessous
# de struggling-threshold. Entre les deux, elle est en cours d'apprentissage.
# min-attempts evite de declarer une notion acquise sur un seul coup de chance.
# ---------------------------------------------------------------------------
ojino.mastery.mastered-threshold=0.80
ojino.mastery.struggling-threshold=0.40
ojino.mastery.min-attempts=3
# Poids du plus recent : plus il est haut, plus la maitrise suit les derniers
# resultats plutot que la moyenne de toute l'annee.
ojino.mastery.recency-weight=0.30

logging.level.com.schoolcopilot.learning_service=DEBUG
