spring.application.name=assistant-service
server.port=8089

spring.data.mongodb.uri=${MONGODB_URI:mongodb://assistant_service:ojino_dev_password@localhost:27017/ojino_assistant?authSource=ojino_assistant}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Validation des access tokens. Meme secret que l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth
ojino.security.internal-token=${OJINO_INTERNAL_TOKEN:dev-internal-token-a-remplacer-en-production}

# ---------------------------------------------------------------------------
# Moteur d'inference.
# "canned" fabrique une reponse au lieu d'en generer une : tout le parcours —
# quotas, garde-fous, contexte — est ainsi eprouvable sans compte ni facture.
# "remote" appelle ai-service. Le reste du service ne change pas : c'est ce que
# le port avait achete.
# ---------------------------------------------------------------------------
ojino.assistant.engine=${AI_ENGINE:canned}

# Le service d'inference, quand le moteur distant est actif.
# Les delais n'ont rien a voir avec ceux des services de contexte plus bas : une
# inference met plusieurs secondes, et c'est le seul appel du service ou
# l'attente n'est pas le signe d'une panne.
ojino.assistant.ai.base-url=${AI_SERVICE_URL:http://localhost:8091}
ojino.assistant.ai.internal-token=${OJINO_INTERNAL_TOKEN:dev-internal-token-a-remplacer-en-production}
ojino.assistant.ai.connect-timeout=2s
ojino.assistant.ai.read-timeout=45s

# ---------------------------------------------------------------------------
# Quotas. Ils arbitrent un cout reel, et le bon reglage se mesure plutot qu'il
# ne se decide. Volontairement uniformes au depart : un quota differencie sans
# donnees serait une supposition deguisee en regle.
# ---------------------------------------------------------------------------
ojino.assistant.quota.daily-messages=50
ojino.assistant.quota.daily-tokens=100000
ojino.assistant.quota.max-input-chars=4000

# ---------------------------------------------------------------------------
# Fenetre de contexte. Les deux limites se combinent : le nombre de tours garde
# le fil coherent, le volume protege du cas ou quelques messages tres longs
# suffiraient a tout saturer.
# ---------------------------------------------------------------------------
ojino.assistant.context.max-turns=10
ojino.assistant.context.max-history-chars=8000

# ---------------------------------------------------------------------------
# Services consultes pour construire le contexte.
# Une panne de user-service refuse la question : sans le niveau, pas de registre
# de langage. Les deux autres degradent seulement la reponse.
# ---------------------------------------------------------------------------
ojino.downstream.user.base-url=${USER_SERVICE_URL:http://localhost:8082}
ojino.downstream.user.connect-timeout=2s
ojino.downstream.user.read-timeout=3s

ojino.downstream.learning.base-url=${LEARNING_SERVICE_URL:http://localhost:8084}
ojino.downstream.learning.connect-timeout=2s
ojino.downstream.learning.read-timeout=3s

ojino.downstream.content.base-url=${CONTENT_SERVICE_URL:http://localhost:8083}
ojino.downstream.content.connect-timeout=2s
ojino.downstream.content.read-timeout=3s

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.assistant_service=DEBUG
