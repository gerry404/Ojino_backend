spring.application.name=engagement-service
server.port=8088

spring.data.mongodb.uri=${MONGODB_URI:mongodb://engagement_service:ojino_dev_password@localhost:27017/ojino_engagement?authSource=ojino_engagement}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Validation des access tokens. Meme secret que l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth
ojino.security.internal-token=${OJINO_INTERNAL_TOKEN:dev-internal-token-a-remplacer-en-production}

# ---------------------------------------------------------------------------
# Relances : le service de notification reste seul juge de l'envoi effectif.
# ---------------------------------------------------------------------------
ojino.downstream.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}
ojino.downstream.notification.internal-token=${OJINO_INTERNAL_TOKEN:dev-internal-token-a-remplacer-en-production}
ojino.downstream.notification.connect-timeout=2s
ojino.downstream.notification.read-timeout=3s

# ---------------------------------------------------------------------------
# Motivation.
# Ce sont des choix pedagogiques : le bon nombre de jokers n'est pas le meme pour
# un enfant de six ans et pour un etudiant en prepa.
# ---------------------------------------------------------------------------
ojino.engagement.initial-freezes=2
# Sans plafond, une absence de trois mois se traduirait par une reserve suffisante
# pour tout absorber, et la serie ne voudrait plus rien dire.
ojino.engagement.max-freezes=3
ojino.engagement.freezes-per-week=1

# Compromis : trop tot la relance arrive avant que la journee ait eu sa chance,
# trop tard elle tombe dans les heures de silence.
ojino.engagement.streak-at-risk-hour=19
ojino.engagement.streak-reminder-cron=0 0 19 * * *

# Fenetre d'observation de l'humeur, et seuils au-dela desquels on propose
# quelque chose. Une mauvaise journee n'est pas une tendance.
ojino.engagement.mood-window-days=7
ojino.engagement.low-mood-threshold=2.5
ojino.engagement.high-workload-threshold=4.0

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.engagement_service=DEBUG
