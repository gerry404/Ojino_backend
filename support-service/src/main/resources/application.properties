spring.application.name=support-service
server.port=8092

spring.data.mongodb.uri=${MONGODB_URI:mongodb://support_service:ojino_dev_password@localhost:27017/ojino_support?authSource=ojino_support}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Validation des access tokens. Meme secret que l'auth-service.
# ---------------------------------------------------------------------------
ojino.security.jwt.secret=${OJINO_JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32+}
ojino.security.jwt.issuer=ojino-auth

# ---------------------------------------------------------------------------
# Centre d'aide.
# ---------------------------------------------------------------------------
# La FAQ est-elle lisible sans etre connecte ? Laisse a false pour l'instant :
# c'est une decision produit, et le tuto te demande de la trancher toi-meme.
ojino.support.faq.public-access=${SUPPORT_FAQ_PUBLIC:false}

ojino.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.schoolcopilot.support_service=DEBUG
